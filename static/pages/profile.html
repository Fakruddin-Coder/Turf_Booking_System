<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile · Greenfield Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
<div id="navbar"></div>
<main class="container" style="padding:2rem 1.25rem">
  <h1 style="font-size:2rem;font-family:Poppins">Profile</h1>
  <p style="color:var(--text-muted);margin-bottom:1.5rem">Your account and full booking history (including cancellations).</p>

  <div id="guest-msg" style="display:none" class="card center">
    <p>Please log in to view your profile.</p>
    <a href="login.html" class="btn btn-primary" style="margin-top:1rem">Login</a>
  </div>

  <div id="profile-content" style="display:none">
    <div class="card" style="margin-bottom:1.25rem">
      <h3 style="margin:0 0 .75rem;font-family:Poppins">Account</h3>
      <div class="summary-row"><span>Name</span><span id="acc-name">—</span></div>
      <div class="summary-row"><span>Email</span><span id="acc-email">—</span></div>
      <div class="summary-row"><span>WhatsApp</span><span id="acc-wa">—</span></div>
    </div>

    <div class="card" style="margin-bottom:1rem">
      <h3 style="margin:0 0 .5rem;font-family:Poppins">Bookings</h3>
      <p style="font-size:.85rem;color:var(--text-muted);margin:0 0 1rem">Upcoming slots can be cancelled here. Completed and cancelled rows are kept for your records.</p>
      <div class="tabs" id="tabs">
        <button type="button" class="tab active" data-status="upcoming">Upcoming</button>
        <button type="button" class="tab" data-status="completed">Completed</button>
        <button type="button" class="tab" data-status="cancelled">Cancelled</button>
      </div>
      <div id="list" style="margin-top:1rem"></div>
    </div>
  </div>
</main>
<div id="footer"></div>
<div id="toast-root"></div>
<script src="../js/app.js"></script>
<script src="../js/components.js"></script>
<script>
let active = "upcoming";

function sameUser(b, u) {
  return Number(b.userId) === Number(u.id);
}

function renderAccount(u) {
  document.getElementById("acc-name").textContent = u.name || "—";
  document.getElementById("acc-email").textContent = u.email || "—";
  document.getElementById("acc-wa").textContent = u.whatsapp && u.whatsapp.trim() ? u.whatsapp : "—";
}

function renderList() {
  const u = Store.get().user;
  const items = Store.get().bookings.filter(b => sameUser(b, u) && b.status === active);
  const list = document.getElementById("list");
  if (!items.length) {
    list.innerHTML = `<div class="center" style="padding:1.5rem;color:var(--text-muted)">No ${active} bookings.</div>`;
    return;
  }
  list.innerHTML = items.map(b => `
    <div class="card" style="margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
      <div>
        <div style="font-weight:700;font-family:Poppins">${b.id}</div>
        <div style="color:var(--text-muted);font-size:.9rem">${fmtDate(b.date)} · ${b.slotIds.map(s => s.split("-")[0]).join(", ")} · ${b.slotIds.length}h</div>
        <div style="font-size:.8rem;color:var(--text-muted);margin-top:.25rem">Paid via ${b.paymentMethod || "upi"} · ${b.createdAt ? new Date(b.createdAt).toLocaleString() : ""}</div>
        <span class="status-pill status-${b.status}" style="margin-top:.35rem;display:inline-block">${b.status}</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <strong style="font-family:Poppins;font-size:1.25rem">₹${b.amount}</strong>
        <a class="btn btn-ghost" href="confirmation.html?id=${encodeURIComponent(b.id)}">Receipt</a>
        ${b.status === "upcoming" ? `<button type="button" class="btn btn-danger" data-cancel="${b.id}">Cancel</button>` : ""}
      </div>
    </div>`).join("");
  document.querySelectorAll("[data-cancel]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm("Cancel this booking?")) return;
      Store.cancelBooking(btn.dataset.cancel);
      toast("Booking cancelled", "success");
      Store.refreshStatuses();
      renderAccount(Store.get().user);
      renderList();
    });
  });
}

function init() {
  const u = Store.get().user;
  if (!u) {
    document.getElementById("guest-msg").style.display = "block";
    return;
  }
  document.getElementById("profile-content").style.display = "block";
  renderAccount(u);
  renderList();
}

document.querySelectorAll("#tabs .tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    active = t.dataset.status;
    renderList();
  });
});

Store.refreshStatuses();
init();
</script>
</body>
</html>
