<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings · Greenfield Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head><body>
<div id="navbar"></div>
<main class="container" style="padding:2rem 1.25rem">
  <h1 style="font-size:2rem">My Bookings</h1>
  <div class="tabs" id="tabs">
    <button class="tab active" data-status="upcoming">Upcoming</button>
    <button class="tab" data-status="completed">Completed</button>
    <button class="tab" data-status="cancelled">Cancelled</button>
  </div>
  <div id="list"></div>
</main>
<div id="footer"></div><div id="toast-root"></div>
<script src="../js/app.js"></script><script src="../js/components.js"></script>
<script>
let active = "upcoming";
function render() {
  const u = Store.get().user;
  if (!u) { document.getElementById("list").innerHTML = `<div class="card center"><p>Please login to see your bookings.</p><a href="login.html" class="btn btn-primary">Login</a></div>`; return; }
  const items = Store.get().bookings.filter(b => b.userId === u.id && b.status === active);
  if (!items.length) { document.getElementById("list").innerHTML = `<div class="card center"><p>No ${active} bookings yet.</p></div>`; return; }
  document.getElementById("list").innerHTML = items.map(b => `
    <div class="card" style="margin-bottom:.75rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem">
      <div>
        <div style="font-weight:700;font-family:Poppins">${b.id}</div>
        <div style="color:var(--text-muted);font-size:.9rem">${fmtDate(b.date)} · ${b.slotIds.map(s=>s.split("-")[0]).join(", ")} · ${b.slotIds.length}h</div>
        <span class="status-pill status-${b.status}" style="margin-top:.35rem;display:inline-block">${b.status}</span>
      </div>
      <div style="display:flex;gap:.5rem;align-items:center">
        <strong style="font-family:Poppins;font-size:1.25rem">₹${b.amount}</strong>
        <a class="btn btn-ghost" href="confirmation.html?id=${b.id}">View</a>
        ${b.status === "upcoming" ? `<button class="btn btn-danger" data-cancel="${b.id}">Cancel</button>` : ""}
      </div>
    </div>`).join("");
  document.querySelectorAll("[data-cancel]").forEach(btn => btn.addEventListener("click", () => {
    if (!confirm("Cancel this booking?")) return;
    Store.cancelBooking(btn.dataset.cancel); toast("Booking cancelled", "success"); render();
  }));
}
document.querySelectorAll("#tabs .tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active"); active = t.dataset.status; render();
}));
render();
</script>
</body></html>
